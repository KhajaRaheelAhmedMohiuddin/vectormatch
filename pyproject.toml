[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vectormatch"
version = "1.1.0"
description = "Hybrid semantic job matching with six interchangeable vector databases, benchmarked head to head."
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaja Raheel Ahmed Mohiuddin" }]
requires-python = ">=3.12"
keywords = ["vector-database", "semantic-search", "hybrid-search", "rag", "faiss", "qdrant", "pgvector",
            "chroma", "lancedb", "milvus", "hnsw", "embeddings", "information-retrieval"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Intended Audience :: Developers",
]
# Exact, tested pins live in requirements.txt; these ranges keep `pip install -e .` flexible.
dependencies = [
    "faiss-cpu>=1.9", "qdrant-client>=1.12", "chromadb>=1.0", "lancedb>=0.20", "pymilvus[milvus_lite]>=2.5",
    "psycopg[binary]>=3.2", "pgvector>=0.3", "sentence-transformers>=3.0", "torch>=2.3", "scipy>=1.13",
    "numpy>=2.0", "pandas>=2.2", "pyarrow>=16", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27",
    "streamlit>=1.35", "plotly>=5.20", "matplotlib>=3.8", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "rank-bm25>=0.2.2", "pre-commit>=3.7"]

[project.urls]
Repository = "https://github.com/KhajaRaheelAhmedMohiuddin/vectormatch"
Benchmarks = "https://github.com/KhajaRaheelAhmedMohiuddin/vectormatch/blob/main/docs/BENCHMARKS.md"

[tool.setuptools.packages.find]
include = ["vectormatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["vectormatch", "api"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "B905"]
