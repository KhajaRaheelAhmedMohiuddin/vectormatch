# Full stack: API + UI + real Qdrant and Postgres/pgvector servers.
#   make data            # once: download + embed (writes ./data)
#   docker compose up
services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectormatch
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      QDRANT_URL: http://qdrant:6333
      PG_DSN: postgresql://postgres:postgres@postgres:5432/vectormatch
      VM_BACKEND: ${VM_BACKEND:-faiss}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      QDRANT_URL: http://qdrant:6333
      PG_DSN: postgresql://postgres:postgres@postgres:5432/vectormatch
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes: ["./data:/app/data"]
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant_data:
  pg_data:
