name: Bug report
description: Something returns wrong results, crashes, or a benchmark does not reproduce
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: Include the command or API request and the full error / unexpected output.
    validations: {required: true}
  - type: textarea
    attributes:
      label: Expected behaviour
  - type: input
    attributes:
      label: Backend and index
      placeholder: e.g. pgvector / hnsw(m=16)
  - type: input
    attributes:
      label: Environment
      placeholder: OS, Python version, CPU count
