# At most two update PRs a month: one for GitHub Actions, one for Python packages.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message: {prefix: "deps"}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      github-actions:
        patterns: ["*"]
    commit-message: {prefix: "ci"}
